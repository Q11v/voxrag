[project]
name = "voxrag"
version = "0.1.0"
description = "Audio RAG pipeline — transcribe, embed, retrieve, and answer with streaming LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.1",
    "mlx-whisper>=0.4.3",
    "openai>=2.46.0",
    "openai-whisper>=20250625",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
]

[project.scripts]
voxrag = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
